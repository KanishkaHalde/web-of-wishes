<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Boyfriend's Day ❤️</title>

    <!-- Template base path -->
    <base href="/templates/boyfriends-day/">

    <!-- CSS -->
    <link rel="stylesheet"
          href="/templates/boyfriends-day/css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&family=Shadows+Into+Light&display=swap"
          rel="stylesheet">

</head>


<body>

<div class="page" id="page">


    <!-- =====================================================
         CONTINUE BUTTON
    ====================================================== -->

    <button
        class="candle-btn"
        id="candleBtn"
        onclick="changePage()">

        <span class="wind">≋</span>

        <span id="btnText">
            Continue
        </span>

    </button>


    <!-- =====================================================
         ACCEPT GIFT SCREEN
    ====================================================== -->

    <div id="acceptGiftPage"
         style="display:none;">

        <h1 id="acceptHeading">
            PLEASE ACCEPT THE GIFT
        </h1>

        <img
            src="assets/sticker1.png"
            id="acceptSticker"
            alt="Gift sticker">

        <div id="acceptButtons">

            <button onclick="acceptGift()">
                YES
            </button>

            <button onclick="rejectGift()">
                NO
            </button>

        </div>

    </div>


    <!-- =====================================================
         GIFTS
    ====================================================== -->

    <h1 id="giftHeading">
        Choose Your Gifts ❤️
    </h1>


    <div
        class="gifts"
        id="giftsContainer">

        <img
            src="assets/gift11.png"
            class="gift"
            id="gift1"
            onclick="expandGift1()"
            alt="Letter gift">

        <img
            src="assets/gift22.png"
            class="gift"
            id="gift2"
            onclick="expandGift2()"
            alt="Photo gift">

        <img
            src="assets/gift333.png"
            class="gift"
            id="gift3"
            onclick="expandGift3()"
            alt="Music gift">

    </div>


    <!-- =====================================================
         LETTER / CARD
    ====================================================== -->

    <div
        id="cardContainer"
        style="display:none;">

        <img
            id="cardImage"
            src="assets/close_card.png"
            onclick="openCard()"
            alt="Card">

    </div>


    <!-- =====================================================
         MUSIC
    ====================================================== -->

    <div
        id="musicSection"
        style="display:none;">

        <img
            src="assets/music_card.png"
            id="musicCard"
            alt="Music card">


        <div id="spotifyCard">

            <img
                src=""
                id="albumCover"
                alt="Album cover">

            <div id="songInfo">

                <div id="songTitle">
                    Loading...
                </div>

                <div id="artistName">
                    Loading...
                </div>

            </div>


            <button
                id="playBtn"
                onclick="toggleMusic()">

                ▶

            </button>

        </div>


        <audio id="birthdaySong">

            <source
                src=""
                type="audio/mpeg">

        </audio>

    </div>


    <!-- =====================================================
         SIDE IMAGE
    ====================================================== -->

    <img
        id="sideImage"
        src="assets/img.png"
        alt="Decoration">


    <!-- =====================================================
         BACK BUTTON
    ====================================================== -->

    <button
        id="backBtn"
        onclick="goBack()">

        ← Back

    </button>


    <!-- =====================================================
         LETTER TEXT
    ====================================================== -->

    <div id="letterText">

        <h2>
            Happy Boyfriend's Day ❤️
        </h2>

    </div>


</div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase/config.js"></script>


<!-- =========================================================
     CONFETTI
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>


<!-- =========================================================
     BOYFRIEND'S DAY JAVASCRIPT
========================================================= -->

<script src="js/script.js"></script>
</body>

</html>
